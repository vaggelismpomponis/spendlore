<!doctype html>
<html lang="el">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <!-- Theme color for mobile browser toolbars (Chrome omnibox, Safari address bar, Android status bar) -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212" />
  <meta name="theme-color" content="#ffffff" id="meta-theme-color" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="Spendlore — Έξυπνη διαχείριση προσωπικών οικονομικών. Καταγραφή εξόδων, προϋπολογισμοί, στόχοι αποταμίευσης, σάρωση αποδείξεων OCR. Δωρεάν για Android & Web." />

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Spendlore — Τα οικονομικά σου, απλά." />
  <meta property="og:description" content="Καταγραφή εξόδων, έξυπνοι προϋπολογισμοί, στόχοι αποταμίευσης και σάρωση αποδείξεων. Δωρεάν για Android & Web." />
  <meta property="og:image" content="https://www.spendlore.gr/play-store-icon-512.png" />
  <meta property="og:url" content="https://www.spendlore.gr" />
  <meta property="og:site_name" content="Spendlore" />
  <meta property="og:locale" content="el_GR" />
  <meta property="og:locale:alternate" content="en_US" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Spendlore — Τα οικονομικά σου, απλά." />
  <meta name="twitter:description" content="Καταγραφή εξόδων, έξυπνοι προϋπολογισμοί, στόχοι αποταμίευσης. Δωρεάν." />
  <meta name="twitter:image" content="https://www.spendlore.gr/play-store-icon-512.png" />

  <!-- SEO Structured Data (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "MobileApplication",
    "name": "Spendlore",
    "operatingSystem": "Android",
    "applicationCategory": "FinanceApplication",
    "url": "https://www.spendlore.gr",
    "description": "Έξυπνη διαχείριση προσωπικών οικονομικών. Καταγραφή εξόδων, προϋπολογισμοί, στόχοι αποταμίευσης, σάρωση αποδείξεων OCR.",
    "inLanguage": ["el", "en"],
    "offers": [
      {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "EUR",
        "name": "Free"
      },
      {
        "@type": "Offer",
        "price": "2.99",
        "priceCurrency": "EUR",
        "name": "Pro Monthly"
      }
    ],
    "aggregateRating": {
      "@type": "AggregateRating",
      "ratingValue": "4.9",
      "ratingCount": "50"
    },
    "image": "https://www.spendlore.gr/play-store-icon-512.png",
    "screenshot": "https://www.spendlore.gr/spendlore-full-logo.png",
    "author": {
      "@type": "Organization",
      "name": "Spendlore"
    }
  }
  </script>

  <!-- Preconnect to font origins to reduce latency -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Load Google Fonts asynchronously (non-render-blocking) -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'" crossorigin />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" /></noscript>

  <title>Spendlore</title>

  <!-- Prevent flash of unstyled theme & align browser toolbars before render -->
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('theme');
        var isDark = savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          metas.forEach(function (m) { m.setAttribute('content', '#121212'); });
        }
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <style>
    body { 
      margin: 0; 
      background-color: #0B0B0F; 
      color: white;
    }
  </style>
  <main>
  <!-- Inline Loading Screen — OUTSIDE #root so React doesn't remove it.
       Modern Play Store FinTech splash screen featuring the official app logo,
       Material You fluid progress indicator, and bank-grade security branding.
       App.jsx fades it out when React is ready. -->
  <div id="inline-loader" style="
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 38%, rgba(124,58,237,0.18) 0%, rgba(15,14,26,0.96) 55%, #08070D 100%);
      font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    ">

      <!-- Center Branding Container -->
      <div style="position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center;">

        <!-- Official App Logo (Squircle Container) -->
        <div style="position: relative; display: flex; align-items: center; justify-content: center; margin-bottom: 22px;">
          <!-- Ambient Glow Disk -->
          <div style="
            position: absolute;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(124,58,237,0.35) 0%, rgba(99,102,241,0.12) 50%, transparent 70%);
            filter: blur(20px);
            pointer-events: none;
            animation: sw-pulse 3s ease-in-out infinite;
          "></div>

          <!-- White Squircle matching LoginView roundness -->
          <div class="sw-logo-img" style="
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 24px;
            background: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 16px 36px rgba(0,0,0,0.45), 0 0 24px rgba(124,58,237,0.3);
          ">
            <img src="/spendlore-mark.png" alt="Spendlore" width="54" height="54" style="
              width: 100%;
              height: 100%;
              object-fit: contain;
              filter: drop-shadow(0 4px 10px rgba(124,58,237,0.35));
            " />
          </div>
        </div>

        <!-- Brand Name & Clean FinTech Subtitle -->
        <div style="text-align: center;">
          <h1 style="
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin: 0;
            color: #FFFFFF;
            font-family: 'Outfit', 'Inter', -apple-system, sans-serif;
          ">Spendlore</h1>
          <p style="
            margin: 6px 0 0 0;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.01em;
            color: rgba(255,255,255,0.46);
          ">Έξυπνη Διαχείριση Οικονομικών</p>
        </div>

        <!-- Material You Fluid Indeterminate Progress Bar -->
        <div style="
          margin-top: 36px;
          width: 140px;
          height: 3.5px;
          border-radius: 999px;
          background: rgba(255,255,255,0.08);
          overflow: hidden;
          position: relative;
        ">
          <div class="sw-indeterminate-bar" style="
            position: absolute;
            top: 0;
            bottom: 0;
            border-radius: 999px;
            background: linear-gradient(90deg, #7c3aed, #a78bfa, #38bdf8);
          "></div>
        </div>

        <!-- Subtle Loading Cue -->
        <p style="
          margin-top: 14px;
          font-size: 11px;
          font-weight: 500;
          letter-spacing: 0.04em;
          color: rgba(255,255,255,0.32);
        ">Φόρτωση...</p>
      </div>

      <!-- Play Store Style Security & Version Footnote -->
      <div style="
        position: absolute;
        bottom: calc(26px + env(safe-area-inset-bottom, 0px));
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
      ">
        <div style="display: flex; align-items: center; gap: 6px; color: rgba(255,255,255,0.38);">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <span style="font-size: 11px; font-weight: 500; letter-spacing: 0.02em;">Ασφαλής κρυπτογράφηση</span>
        </div>
        <span style="font-size: 9px; font-weight: 600; letter-spacing: 0.08em; color: rgba(255,255,255,0.18); text-transform: uppercase;">Spendlore</span>
      </div>
    </div>

    <!-- Smooth GPU-accelerated Keyframes -->
    <style>
      @keyframes sw-pulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50%      { transform: scale(1.1); opacity: 1; }
      }
      @keyframes sw-float {
        0%, 100% { transform: translateY(0px); }
        50%      { transform: translateY(-4px); }
      }
      @keyframes sw-slide {
        0%   { left: -50%; width: 35%; }
        50%  { left: 25%;  width: 55%; }
        100% { left: 105%; width: 35%; }
      }
      .sw-logo-img {
        animation: sw-float 3s ease-in-out infinite;
      }
      .sw-indeterminate-bar {
        animation: sw-slide 1.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
    </style>
  <script>
    (function () {
      // Safety auto-dismiss: ensure inline-loader never remains stuck over the screen
      var dismissLoader = function () {
        var loader = document.getElementById('inline-loader');
        if (loader) {
          loader.style.transition = 'opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1)';
          loader.style.opacity = '0';
          loader.style.transform = 'scale(1.02)';
          loader.style.pointerEvents = 'none';
          setTimeout(function () {
            if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
          }, 420);
        }
      };
      // Auto-dismiss safety timer (6 seconds fallback)
      setTimeout(dismissLoader, 6000);
      window.__dismissInlineLoader = dismissLoader;
    })();
  </script>
  <!-- React mounts here — inline-loader stays visible on top until App.jsx fades it out -->
  <div id="root"></div>
  </main>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
