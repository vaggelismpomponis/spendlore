<!doctype html>
<html lang="el">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <!-- Theme color for mobile browser toolbars (Chrome omnibox, Safari address bar, Android status bar) -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212" />
  <meta name="theme-color" content="#ffffff" id="meta-theme-color" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="Spendlore — Έξυπνη διαχείριση προσωπικών οικονομικών. Καταγραφή εξόδων, προϋπολογισμοί, στόχοι αποταμίευσης, σάρωση αποδείξεων OCR. Δωρεάν για Android & Web." />

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Spendlore — Τα οικονομικά σου, απλά." />
  <meta property="og:description" content="Καταγραφή εξόδων, έξυπνοι προϋπολογισμοί, στόχοι αποταμίευσης και σάρωση αποδείξεων. Δωρεάν για Android & Web." />
  <meta property="og:image" content="https://www.spendlore.gr/play-store-icon-512.png" />
  <meta property="og:url" content="https://www.spendlore.gr" />
  <meta property="og:site_name" content="Spendlore" />
  <meta property="og:locale" content="el_GR" />
  <meta property="og:locale:alternate" content="en_US" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Spendlore — Τα οικονομικά σου, απλά." />
  <meta name="twitter:description" content="Καταγραφή εξόδων, έξυπνοι προϋπολογισμοί, στόχοι αποταμίευσης. Δωρεάν." />
  <meta name="twitter:image" content="https://www.spendlore.gr/play-store-icon-512.png" />

  <!-- Legal Links for Google & Crawlers -->
  <link rel="privacy-policy" href="/privacy" />
  <link rel="terms-of-service" href="/terms" />
  <link rel="privacy-policy" href="https://spendwise.online/privacy" />
  <link rel="terms-of-service" href="https://spendwise.online/terms" />
  <link rel="privacy-policy" href="https://www.spendlore.gr/privacy" />
  <link rel="terms-of-service" href="https://www.spendlore.gr/terms" />

  <!-- SEO Structured Data (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "MobileApplication",
    "name": "Spendlore",
    "operatingSystem": "Android",
    "applicationCategory": "FinanceApplication",
    "url": "https://www.spendlore.gr",
    "description": "Έξυπνη διαχείριση προσωπικών οικονομικών. Καταγραφή εξόδων, προϋπολογισμοί, στόχοι αποταμίευσης, σάρωση αποδείξεων OCR.",
    "inLanguage": ["el", "en"],
    "offers": [
      {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "EUR",
        "name": "Free"
      },
      {
        "@type": "Offer",
        "price": "2.99",
        "priceCurrency": "EUR",
        "name": "Pro Monthly"
      }
    ],
    "aggregateRating": {
      "@type": "AggregateRating",
      "ratingValue": "4.9",
      "ratingCount": "50"
    },
    "image": "https://www.spendlore.gr/play-store-icon-512.png",
    "screenshot": "https://www.spendlore.gr/spendlore-full-logo.png",
    "author": {
      "@type": "Organization",
      "name": "Spendlore"
    }
  }
  </script>

  <!-- Preconnect to font origins to reduce latency -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Load Google Fonts asynchronously (non-render-blocking) -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'" crossorigin />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" /></noscript>

  <title>Spendlore</title>

  <!-- Prevent flash of unstyled theme & align browser toolbars before render -->
  <script>
    window.__spendloreStartTime = Date.now();
    (function () {
      try {
        var savedTheme = localStorage.getItem('theme');
        var isDark = savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          metas.forEach(function (m) { m.setAttribute('content', '#121212'); });
        }
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <style>
    body { 
      margin: 0; 
      background-color: #08070D; 
      color: white;
    }
  </style>
  <main>
  <!-- Inline Loading Screen — OUTSIDE #root so React doesn't remove it.
       Flagship Play Store FinTech splash screen featuring the official app logo,
       ambient luxury glow halo, specular glass shimmer, and bank-grade security branding.
       App.jsx fades it out gracefully after ensuring minimum branded visibility. -->
  <div id="inline-loader" style="
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #08070D;
      font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    ">

      <!-- Micro Dot Matrix Grid (matching LoginView) -->
      <div style="
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.08;
        background-image: radial-gradient(rgba(255, 255, 255, 0.4) 1px, transparent 1px);
        background-size: 24px 24px;
      "></div>

      <!-- Center Branding Container -->
      <div class="sw-brand-wrapper" style="position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center;">

        <!-- Ambient Luxury Radial Glow Halo -->
        <div class="sw-ambient-glow" style="
          position: absolute;
          top: -24px;
          width: 220px;
          height: 220px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(124, 58, 237, 0.38) 0%, rgba(56, 189, 248, 0.16) 45%, transparent 70%);
          filter: blur(28px);
          pointer-events: none;
          z-index: 0;
        "></div>

        <!-- Official App Logo (Elevated Glass Squircle Container) -->
        <div class="sw-logo-box" style="
          position: relative;
          z-index: 1;
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 22px;
        ">
          <div class="sw-logo-card" style="
            position: relative;
            width: 96px;
            height: 96px;
            border-radius: 24px;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.13) 0%, rgba(255, 255, 255, 0.04) 100%);
            border: 1px solid rgba(255, 255, 255, 0.22);
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 16px 40px -6px rgba(0, 0, 0, 0.65), inset 0 1px 1px 0 rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            overflow: hidden;
          ">
            <!-- Shimmer Light Sweep -->
            <div class="sw-shimmer-sweep"></div>

            <img src="/spendlore-mark.png" alt="Spendlore" width="64" height="64" style="
              width: 100%;
              height: 100%;
              object-fit: contain;
              filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.35));
            " />
          </div>
        </div>

        <!-- Brand Name & Clean FinTech Subtitle -->
        <div class="sw-text-block" style="text-align: center;">
          <h1 style="
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin: 0;
            color: #FFFFFF;
            font-family: 'Outfit', 'Inter', -apple-system, sans-serif;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
          ">Spendlore</h1>
          <p style="
            margin: 7px 0 0 0;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.02em;
            color: #9CA3AF;
          ">Έξυπνη Διαχείριση Οικονομικών</p>
        </div>

        <!-- Material You Fluid Indeterminate Progress Bar -->
        <div class="sw-progress-block" style="
          margin-top: 36px;
          width: 150px;
          height: 3.5px;
          border-radius: 999px;
          background: rgba(255, 255, 255, 0.08);
          overflow: hidden;
          position: relative;
          box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
        ">
          <div class="sw-indeterminate-bar" style="
            position: absolute;
            top: 0;
            bottom: 0;
            border-radius: 999px;
            background: linear-gradient(90deg, #7c3aed, #a78bfa, #38bdf8);
            box-shadow: 0 0 10px rgba(124, 58, 237, 0.6);
          "></div>
        </div>

        <!-- Subtle Loading Cue -->
        <p class="sw-status-cue" style="
          margin-top: 14px;
          font-size: 10px;
          font-weight: 600;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: rgba(255, 255, 255, 0.38);
        ">Φόρτωση...</p>
      </div>

      <!-- Play Store Style Security & Version Footnote -->
      <div class="sw-footnote" style="
        position: absolute;
        bottom: calc(26px + env(safe-area-inset-bottom, 0px));
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
      ">
        <div style="display: flex; align-items: center; gap: 6px; color: rgba(255, 255, 255, 0.4);">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <span style="font-size: 11px; font-weight: 500; letter-spacing: 0.02em;">Ασφαλής κρυπτογράφηση</span>
        </div>
        <span style="font-size: 9px; font-weight: 600; letter-spacing: 0.08em; color: rgba(255, 255, 255, 0.2); text-transform: uppercase;">Spendlore</span>
      </div>
    </div>

    <!-- Smooth GPU-accelerated Keyframes -->
    <style>
      @keyframes sw-logo-reveal {
        0% {
          transform: scale(0.82);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes sw-logo-breathe {
        0%, 100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.028);
        }
      }
      @keyframes sw-glow-pulse {
        0%, 100% {
          transform: scale(0.95);
          opacity: 0.6;
        }
        50% {
          transform: scale(1.12);
          opacity: 0.95;
        }
      }
      @keyframes sw-shimmer {
        0% {
          transform: translateX(-120%) rotate(25deg);
        }
        25%, 100% {
          transform: translateX(220%) rotate(25deg);
        }
      }
      @keyframes sw-fade-up {
        0% {
          transform: translateY(8px);
          opacity: 0;
        }
        100% {
          transform: translateY(0);
          opacity: 1;
        }
      }
      @keyframes sw-slide {
        0%   { left: -50%; width: 35%; }
        50%  { left: 25%;  width: 55%; }
        100% { left: 105%; width: 35%; }
      }
      .sw-ambient-glow {
        animation: sw-glow-pulse 3.4s ease-in-out infinite;
      }
      .sw-logo-card {
        animation: 
          sw-logo-reveal 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards,
          sw-logo-breathe 3.6s ease-in-out infinite 0.75s;
        will-change: transform, opacity;
      }
      .sw-shimmer-sweep {
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: linear-gradient(
          to right,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.18) 50%,
          rgba(255, 255, 255, 0) 100%
        );
        animation: sw-shimmer 3.2s ease-in-out infinite 0.3s;
        pointer-events: none;
      }
      .sw-text-block {
        animation: sw-fade-up 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.18s backwards;
      }
      .sw-progress-block {
        animation: sw-fade-up 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.28s backwards;
      }
      .sw-status-cue {
        animation: sw-fade-up 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.36s backwards;
      }
      .sw-footnote {
        animation: sw-fade-up 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.45s backwards;
      }
      .sw-indeterminate-bar {
        animation: sw-slide 1.9s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
    </style>
  <script>
    (function () {
      // Safety auto-dismiss: ensure inline-loader never remains stuck over the screen
      var dismissLoader = function () {
        var loader = document.getElementById('inline-loader');
        if (loader) {
          loader.style.transition = 'opacity 0.48s cubic-bezier(0.16, 1, 0.3, 1), transform 0.48s cubic-bezier(0.16, 1, 0.3, 1)';
          loader.style.opacity = '0';
          loader.style.transform = 'scale(1.04)';
          loader.style.pointerEvents = 'none';
          setTimeout(function () {
            if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
          }, 520);
        }
      };
      // Auto-dismiss safety timer (6.5 seconds fallback)
      setTimeout(dismissLoader, 6500);
      window.__dismissInlineLoader = dismissLoader;
    })();
  </script>
  <!-- React mounts here — inline-loader stays visible on top until App.jsx fades it out -->
  <div id="root"></div>
  </main>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
