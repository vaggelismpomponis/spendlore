<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Primary Royal Violet Gradient -->
    <linearGradient id="primaryRibbon" x1="0.1" y1="0.05" x2="0.9" y2="0.95">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="28%" stop-color="#8B5CF6"/>
      <stop offset="65%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Secondary Front Ribbon Gradient -->
    <linearGradient id="frontRibbon" x1="0.8" y1="0.1" x2="0.2" y2="0.9">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="35%" stop-color="#9333EA"/>
      <stop offset="75%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>

    <!-- Accent Emerald Flow (Growth & Liquid Capital) -->
    <linearGradient id="emeraldAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Ambient Shadow for Ribbon Overlap -->
    <filter id="ribbonShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="-2" dy="6" stdDeviation="8" flood-color="#1E1035" flood-opacity="0.38"/>
    </filter>

    <!-- Inner Core Glow -->
    <linearGradient id="coreGlow" x1="0.3" y1="0.2" x2="0.7" y2="0.8">
      <stop offset="0%" stop-color="#DDD6FE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
  </defs>

  

  <g transform="translate(0, 0)">
    <!-- ── BACKGROUND BACK-LOOP (Bottom curve sweeping up behind) ── -->
    <path
      d="M 256 256
         C 285 292, 335 348, 335 385
         C 335 432, 298 462, 256 462
         C 205 462, 168 424, 168 376
         C 168 322, 218 268, 256 226
         C 278 202, 310 162, 310 126
         C 310 82, 280 50, 240 50
         C 198 50, 172 82, 172 118"
      fill="none"
      stroke="url(#primaryRibbon)"
      stroke-width="58"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- ── FOREGROUND S-RIBBON (The defining crossing S with dimensional shadow) ── -->
    <g filter="url(#ribbonShadow)">
      <path
        d="M 195 102
           C 205 70, 230 50, 260 50
           C 305 50, 344 86, 344 132
           C 344 186, 292 242, 256 280
           C 220 318, 168 368, 168 412
           C 168 448, 192 462, 218 462
           C 252 462, 285 435, 305 400"
        fill="none"
        stroke="url(#frontRibbon)"
        stroke-width="58"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </g>

    <!-- ── INNER SPECULAR ACCENT PATH (Satin Light Reflection) ── -->
    <path
      d="M 242 66
         C 275 66, 326 95, 326 132
         C 326 176, 282 228, 256 256
         C 230 284, 186 336, 186 380"
      fill="none"
      stroke="url(#coreGlow)"
      stroke-width="12"
      stroke-linecap="round"
      opacity="0.75"
    />

    <!-- ── PRECISION FINANCIAL GROWTH GEM (Liquid Capital Dot) ── -->
    <circle cx="340" cy="115" r="13" fill="url(#emeraldAccent)" />
    <circle cx="340" cy="115" r="17" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.6"/>
  </g>
</svg>